name: Check Hermes release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-hermes-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Bump stable Hermes version
        run: bash .github/scripts/bump-hermes.sh
      - name: Commit and publish add-on release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No Hermes update found."
            exit 0
          fi

          version="$(sed -n -E 's/^version: "([^"]+)"$/\1/p' hermes/config.yaml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          upstream="$(sed -n -E 's/^FROM nousresearch\/hermes-agent:(v[^[:space:]]+)$/\1/p' hermes/Dockerfile)"
          git add README.md CHANGELOG.md hermes/Dockerfile hermes/config.yaml
          git commit -m "chore(hermes): bump upstream to ${upstream#v}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          gh release create "v${version}" \
            --title "Hermes Agent add-on ${version}" \
            --notes "Tracks Hermes Agent ${upstream}. The published GHCR image supports amd64 and aarch64."
