worker_processes 1;
pid /opt/data/nginx/nginx.pid;
error_log /opt/data/nginx/error.log warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  access_log /opt/data/nginx/access.log;
  client_body_temp_path /opt/data/nginx/body;
  proxy_temp_path /opt/data/nginx/proxy;
  fastcgi_temp_path /opt/data/nginx/fastcgi;
  uwsgi_temp_path /opt/data/nginx/uwsgi;
  scgi_temp_path /opt/data/nginx/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8099;
    client_max_body_size 100m;
    allow 127.0.0.1;
    allow 172.30.32.2;
    deny all;

    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_buffering off;

    location = /terminal { return 302 /terminal/; }

    location /terminal/ {
      proxy_pass http://127.0.0.1:7681/terminal/;
    }

    location / {
      proxy_pass http://127.0.0.1:9120;
      sub_filter_once off;
      sub_filter 'window.__HERMES_BASE_PATH__=""' 'window.__HERMES_BASE_PATH__="$http_x_ingress_path"';
      sub_filter 'src="/assets/' 'src="$http_x_ingress_path/assets/';
      sub_filter 'href="/assets/' 'href="$http_x_ingress_path/assets/';
      sub_filter 'href="/favicon.ico"' 'href="$http_x_ingress_path/favicon.ico"';
      sub_filter '</body>' '<style>#ha-terminal{position:fixed;bottom:20px;right:20px;z-index:99999;padding:10px 14px;border:1px solid #00d4aa;border-radius:8px;background:#1a1a2e;color:#00d4aa;font:600 14px monospace;text-decoration:none}#ha-terminal:focus-visible{outline:3px solid white;outline-offset:2px}</style><a id="ha-terminal" href="$http_x_ingress_path/terminal/" target="_blank" rel="noopener noreferrer" aria-label="Open Hermes terminal">&gt;_</a></body>';
    }
  }
}
